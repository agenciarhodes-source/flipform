name: Repair WhatsApp Cloud Schema

on:
  workflow_dispatch:

jobs:
  repair-whatsapp-schema:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      JWT_SECRET_CURRENT: ${{ secrets.JWT_SECRET_CURRENT }}
      JWT_SECRET_PREVIOUS: ${{ secrets.JWT_SECRET_PREVIOUS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Repair WhatsApp Cloud schema
        run: npx tsx scripts/repair-whatsapp-cloud-schema.ts

      - name: Report Prisma migration history (informational)
        continue-on-error: true
        run: npx prisma migrate status

      - name: Confirm WhatsApp schema repair
        run: echo "WhatsApp Cloud schema repair completed successfully."
