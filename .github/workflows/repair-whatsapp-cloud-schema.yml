name: Repair WhatsApp Cloud Schema

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REPAIR whatsapp-cloud-schema to authorize a reviewed maintenance action'
        required: true
        type: string

jobs:
  repair-whatsapp-schema:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-maintenance

    env:
      MAINTENANCE_ACTION: whatsapp-cloud-schema
      MAINTENANCE_CONFIRM: ${{ inputs.confirm }}
      MAINTENANCE_ENVIRONMENT: production-maintenance
      MAINTENANCE_GATE: ${{ vars.MAINTENANCE_GATE }}
      MAINTENANCE_DB_HOST: ${{ vars.MAINTENANCE_DB_HOST }}
      MAINTENANCE_DIRECT_HOST: ${{ vars.MAINTENANCE_DIRECT_HOST }}
      MAINTENANCE_DB_NAME: ${{ vars.MAINTENANCE_DB_NAME }}
      MAINTENANCE_DB_USER: ${{ vars.MAINTENANCE_DB_USER }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      JWT_SECRET_CURRENT: ${{ secrets.JWT_SECRET_CURRENT }}
      JWT_SECRET_PREVIOUS: ${{ secrets.JWT_SECRET_PREVIOUS }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Verify approved maintenance destination before any database operation
        run: node scripts/assert-production-maintenance-db.mjs

      - name: Test maintenance guard (offline)
        run: node --test tests/production-maintenance-guard.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Repair WhatsApp Cloud schema
        run: npx tsx scripts/repair-whatsapp-cloud-schema.ts

      - name: Report Prisma migration history (informational)
        continue-on-error: true
        run: npx prisma migrate status

      - name: Confirm WhatsApp schema repair
        run: echo "WhatsApp Cloud schema repair completed successfully."
