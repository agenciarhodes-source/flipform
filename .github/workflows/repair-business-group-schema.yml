name: Repair Business Group Schema

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REPAIR business-group-schema to authorize a reviewed maintenance action'
        required: true
        type: string

jobs:
  repair-business-group-schema:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-maintenance

    env:
      MAINTENANCE_ACTION: business-group-schema
      MAINTENANCE_CONFIRM: ${{ inputs.confirm }}
      MAINTENANCE_ENVIRONMENT: production-maintenance
      MAINTENANCE_GATE: ${{ vars.MAINTENANCE_GATE }}
      MAINTENANCE_DB_HOST: ${{ vars.MAINTENANCE_DB_HOST }}
      MAINTENANCE_DIRECT_HOST: ${{ vars.MAINTENANCE_DIRECT_HOST }}
      MAINTENANCE_DB_NAME: ${{ vars.MAINTENANCE_DB_NAME }}
      MAINTENANCE_DB_USER: ${{ vars.MAINTENANCE_DB_USER }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Verify approved maintenance destination before any database operation
        run: node scripts/assert-production-maintenance-db.mjs

      - name: Test maintenance guard (offline)
        run: node --test tests/production-maintenance-guard.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply additive business group SQL only
        run: npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20260903233000_add_business_groups/migration.sql

      - name: Report Prisma migration history (informational)
        continue-on-error: true
        run: npx prisma migrate status

      - name: Confirm business group schema repair
        run: echo "Business group schema repair completed. No prisma migrate deploy was executed."
