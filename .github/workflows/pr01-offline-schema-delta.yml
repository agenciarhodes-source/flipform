name: PR01 - Prisma additive SQL delta (OFFLINE)

on:
  pull_request:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - '.github/workflows/pr01-offline-schema-delta.yml'
      - 'scripts/pr01_offline_sql_diff_audit.py'
      - 'tests/test_pr01_offline_sql_diff_audit.py'
      - 'scripts/pr00_a2c2_audit_sql.py'

permissions:
  contents: read

jobs:
  pr01-offline-only:
    name: PR01 92-to-102-model SQL diff audit (NO database access)
    # Isolated to the approved draft branch; never run for unrelated PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/pr01-global-api-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PR01_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Deliberately non-routable connection string. Nothing below connects.
      DATABASE_URL: postgresql://pr01_offline:no_connection@127.0.0.1:1/never_connect
      DIRECT_URL: postgresql://pr01_offline:no_connection@127.0.0.1:1/never_connect
    steps:
      - name: Checkout exact proposed branch commit and baseline history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse local or remote database access and identify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${DATABASE_URL}" = 'postgresql://pr01_offline:no_connection@127.0.0.1:1/never_connect'
          test "${DIRECT_URL}" = "${DATABASE_URL}"
          test ! -e .env
          test ! -e .env.local
          test ! -e .env.production
          git cat-file -e "${PR01_BASE_SHA}^{commit}"
          mkdir -p pr01-sql-review
          git show "${PR01_BASE_SHA}:prisma/schema.prisma" > pr01-sql-review/baseline.prisma
          test -s pr01-sql-review/baseline.prisma
          node -e "const p=require('./package.json');if(p.dependencies.prisma!=='5.22.0'||p.dependencies['@prisma/client']!=='5.22.0')process.exit(1)"

      - name: Offline auditor negative tests (no Node or DB needed)
        run: python3 -m unittest discover -s tests -p 'test_pr01_offline_sql_diff_audit.py' -v

      - name: Set up exact Node dependencies
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Install pinned Prisma CLI
        run: npm ci

      - name: Generate SQL difference between two schema files only
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/prisma validate --schema prisma/schema.prisma
          ./node_modules/.bin/prisma migrate diff \
            --from-schema-datamodel pr01-sql-review/baseline.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            --output pr01-sql-review/ten-new-pr01-tables.sql
          test -s pr01-sql-review/ten-new-pr01-tables.sql

      - name: Reject any change to the 92 existing tables or nonadditive SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr01_offline_sql_diff_audit.py \
            --baseline pr01-sql-review/baseline.prisma \
            --candidate prisma/schema.prisma \
            --sql pr01-sql-review/ten-new-pr01-tables.sql \
            --report pr01-sql-review/additive-audit-report.json
          sha256sum pr01-sql-review/ten-new-pr01-tables.sql > pr01-sql-review/sql-sha256.txt
          git rev-parse HEAD > pr01-sql-review/head-commit.txt
          printf '%s\n' "${PR01_BASE_SHA}" > pr01-sql-review/baseline-commit.txt

      - name: Upload generated SQL and audit report for MANUAL review only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr01-additive-sql-offline-review
          path: pr01-sql-review/
          if-no-files-found: warn
          retention-days: 14
