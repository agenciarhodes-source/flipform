name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      JWT_SECRET_CURRENT: staging-local-secret
      NEXT_PUBLIC_MARKETING_URL: https://flipform.com.br
      NEXT_PUBLIC_APP_URL: https://app.flipform.com.br
      NEXT_PUBLIC_ADMIN_URL: https://admin.flipform.com.br
      APP_HOSTNAME: app.flipform.com.br
      ADMIN_HOSTNAME: admin.flipform.com.br
      EMAIL_PROVIDER: none
      EMAIL_FROM: atendimento@flipform.com.br
      EMAIL_REPLY_TO: atendimento@flipform.com.br
      ASAAS_BASE_URL: https://sandbox.asaas.com/api/v3
      ASAAS_API_KEY: test-placeholder
      ASAAS_WEBHOOK_TOKEN: test-placeholder
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flipform_ci?schema=public
      CRON_SECRET: test-placeholder
      INTERNAL_JOB_SECRET: test-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Verify dependency pins
        run: |
          node -e "const p=require('./package.json'); if (p.dependencies['@radix-ui/react-switch']==='^1.3.5') { throw new Error('Invalid @radix-ui/react-switch version ^1.3.5'); }"
          node -e "const p=require('./package.json'); if (!p.dependencies.nodemailer) { throw new Error('Missing nodemailer dependency'); }"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Python test suite
        run: python -m pytest tests -q

      - name: Run tracking unit tests
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/tracking.test.ts

      - name: Validate environment schema
        run: npm run env:check

      - name: Regression guards
        run: |
          grep -n "evaluateBillingAccess" app/api/webhooks/asaas/route.ts
          grep -n "userId?: string | null" lib/platform-audit.ts
          grep -n "Suspense" app/first-access/page.tsx
          grep -n "Suspense" app/checkout/cancelled/page.tsx
          grep -n "Suspense" app/checkout/error/page.tsx
          grep -R "senha padrão" -n app lib docs || true

      - name: Build
        run: npm run build

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flipform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d flipform_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      JWT_SECRET_CURRENT: staging-local-secret
      NEXT_PUBLIC_MARKETING_URL: https://flipform.com.br
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3000/admin
      APP_HOSTNAME: localhost
      ADMIN_HOSTNAME: admin.flipform.com.br
      EMAIL_PROVIDER: none
      EMAIL_FROM: atendimento@flipform.com.br
      EMAIL_REPLY_TO: atendimento@flipform.com.br
      ASAAS_BASE_URL: https://sandbox.asaas.com/api/v3
      ASAAS_API_KEY: test-placeholder
      ASAAS_WEBHOOK_TOKEN: test-placeholder
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flipform_ci?schema=public
      CRON_SECRET: test-placeholder
      INTERNAL_JOB_SECRET: test-placeholder
      SMOKE_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # The repository contains legacy repair migrations that assume a pre-existing
      # production schema, so migrate deploy cannot bootstrap a brand-new database.
      # Smoke tests use an isolated disposable PostgreSQL database and materialize
      # the current Prisma schema directly. Production migrations remain reviewed
      # and applied separately against Neon.
      - name: Prepare ephemeral database schema
        run: npx prisma db push --skip-generate

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run start &
          sleep 10

      - name: Run smoke test
        run: npm run smoke:test
