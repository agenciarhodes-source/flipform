name: API v1 - Homologation hold (offline only)

on:
  pull_request:
    branches:
      - feature/pr02-forms-catalog-read
    paths:
      - '.github/workflows/api-v1-homologation-preflight.yml'
      - 'scripts/api_v1_homologation_preflight.py'
      - 'tests/test_api_v1_homologation_preflight.py'
      - 'docs/security/api-v1-homologation-evidence-20261121.json'
      - 'docs/security/api-v1-homologation-runbook-20261121.md'
      - 'docs/security/api-v1-retention-decision-workbook-20261122.json'
      - 'docs/security/api-v1-retention-approval-guide-20261122.md'
      - 'vercel.json'

permissions:
  contents: read

jobs:
  safeguard:
    name: Preflight NO-GO - does not deploy or connect to Neon
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/api-v1-homologation-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check offline gate and negative tests
        run: |
          python3 -m unittest discover -s tests -p test_api_v1_homologation_preflight.py -v
          python3 scripts/api_v1_homologation_preflight.py --report "$RUNNER_TEMP/api-v1-homologation-preflight.json"
      - name: Upload non-sensitive hold evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-v1-homologation-no-go-preflight
          path: ${{ runner.temp }}/api-v1-homologation-preflight.json
          if-no-files-found: warn
          retention-days: 14
